name: Auto-fix Bug Reports
on:
  issues:
    types: [opened]

jobs:
  autofix:
    if: contains(github.event.issue.labels.*.name, 'bug-report')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A user hit a bug and reported it through the in-app "Report Bug" button.
            Issue title: "${{ github.event.issue.title }}"
            Issue body: "${{ github.event.issue.body }}"

            Budget your turns carefully. If you are more than 80% through your available turns
            and have not yet committed a fix, stop investigating and immediately leave a comment
            summarizing what you've found so far, even if incomplete. A partial explanation is
            always better than running out of turns with no output.

            Investigate the codebase and identify the root cause.
            Follow CLAUDE.md conventions.

            If you can identify and fix the bug, implement the fix and open a PR referencing
            this issue (#${{ github.event.issue.number }}).

            If you cannot reproduce or identify the bug with confidence, do NOT stay silent.
            Instead, leave a comment on the issue explaining:
            1. What you investigated (files/components checked)
            2. Why you couldn't pinpoint the bug
            3. What additional information would help (e.g. screenshots, exact steps to
               reproduce, browser console errors)

            Always leave a comment on the issue, either way, so there's a record of what happened.
          claude_args: "--max-turns 50 --model claude-sonnet-5 --allowedTools Edit,Write,Bash(git:*),Bash(gh:*)"
